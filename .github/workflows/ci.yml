name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pokemon
          POSTGRES_PASSWORD: pokemon
          POSTGRES_DB: pokemon_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pokemon:pokemon@localhost:5432/pokemon_monitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run migrations
        run: npm run db:migrate:deploy --workspace @pokemon-monitor/db

      - name: Seed E2E data
        run: npm run e2e:seed --workspace @pokemon-monitor/web

      - name: Build web app
        run: npm run build --workspace @pokemon-monitor/web

      - name: Run E2E tests
        run: npm run e2e --workspace @pokemon-monitor/web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
