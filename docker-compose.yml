services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pokemon
      POSTGRES_PASSWORD: pokemon
      POSTGRES_DB: pokemon_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      DATABASE_URL: postgresql://pokemon:pokemon@postgres:5432/pokemon_monitor
      REDIS_URL: redis://redis:6379
      PLAYWRIGHT_ENABLED: "true"
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://pokemon:pokemon@postgres:5432/pokemon_monitor
      REDIS_URL: redis://redis:6379
      PLAYWRIGHT_ENABLED: "true"
      LOG_LEVEL: info
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
